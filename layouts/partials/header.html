<header class="navigation">
    <div class="container">
        <nav class="navbar navbar-expand-lg px-0">
            <a class="navbar-brand d-flex align-items-center" href="{{ "/" | relLangURL }}">
                <img src="{{ .Site.Params.logo | absURL }}" alt="{{ .Site.Title }}" class="img-fluid site-logo">
                <span class="site-brand-text">
                    <strong>{{ .Site.Title }}</strong>
                    <small>{{ .Site.Params.site_tagline }}</small>
                </span>
            </a>
            <button type="button" class="navbar-toggler collapsed" data-toggle="collapse" data-target="#navigation" aria-label="Abrir menu">
                <span class="ion-navicon-round"></span>
            </button>
            <div class="collapse navbar-collapse" id="navigation">
                <ul class="nav navbar-nav ml-auto main-nav-list">
                    <li class="nav-item">
                        <a href="{{ "/" | relLangURL }}" class="nav-link {{ if .IsHome }}active{{ end }}">{{ .Site.Params.home }}</a>
                    </li>
                    {{ range .Site.Menus.main }}
                    <li class="nav-item">
                        <a href="{{ .URL | relLangURL }}" class="nav-link {{ if or ($.IsMenuCurrent `main` .) ($.HasMenuCurrent `main` .) }}active{{ end }}">{{ .Name }}</a>
                    </li>
                    {{ end }}
                </ul>
            </div>
        </nav>
    </div>
</header>

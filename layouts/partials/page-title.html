{{ $bgImage := .Params.bg_image | default "images/featue-bg.jpg" }}
<section class="page-title bg-2" style="background-image: url('{{ $bgImage | absURL }}');">
	<div class="container">
		<div class="row">
			<div class="col-lg-12">
				<div class="block">
					<h1>{{ .Title }}</h1>
					{{ with .Params.Description }}<p>{{ . }}</p>{{ end }}
				</div>
			</div>
		</div>
	</div>
</section>
